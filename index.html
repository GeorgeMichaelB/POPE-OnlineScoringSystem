<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pope Saweros" />
    <meta name="application-name" content="Pope Saweros" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Pope Saweros Sunday School Attendance & Eftekad Pastoral Tracker (Grade 4)" />
    <title>Pope Saweros Sunday School | Attendance & Eftekad</title>

    <!-- PWA Web App Manifest & App Icons -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- Global Error Trapper to prevent blank white screens across devices -->
    <script>
      window.addEventListener('error', function(e) {
        console.error('[Global Error]', e);
        var box = document.getElementById('global-fatal-error');
        if (!box) {
          box = document.createElement('div');
          box.id = 'global-fatal-error';
          box.style.cssText = 'position:fixed;inset:0;background:#090d16;color:#f8fafc;padding:24px;z-index:9999999;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;';
          var card = document.createElement('div');
          card.style.cssText = 'max-width:540px;width:100%;background:#1e293b;border:1.5px solid #ef4444;border-radius:16px;padding:24px;box-shadow:0 25px 50px rgba(0,0,0,0.6);text-align:center;';
          card.innerHTML = '<div style="font-size:42px;margin-bottom:12px;">⚠️</div>' +
            '<h2 style="margin:0 0 8px;color:#f87171;font-size:20px;font-weight:800;">Application Encountered an Error</h2>' +
            '<p style="margin:0 0 16px;color:#94a3b8;font-size:14px;">An issue occurred while loading this device session.</p>' +
            '<pre style="text-align:left;background:#0f172a;color:#fca5a5;padding:12px;border-radius:8px;font-size:12px;overflow:auto;max-height:160px;margin-bottom:18px;">' + (e.message || 'Script error') + '</pre>' +
            '<div style="display:flex;gap:10px;justify-content:center;">' +
            '<button onclick="window.location.reload()" style="background:#2563eb;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:700;cursor:pointer;">Reload App</button>' +
            '<button onclick="try{localStorage.clear();sessionStorage.clear();}catch(err){}window.location.href=window.location.pathname;" style="background:rgba(239,68,68,0.2);color:#f87171;border:1px solid #ef4444;padding:10px 18px;border-radius:8px;font-weight:700;cursor:pointer;">Reset & Login</button>' +
            '</div>';
          box.appendChild(card);
          document.body ? document.body.appendChild(box) : document.documentElement.appendChild(box);
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
