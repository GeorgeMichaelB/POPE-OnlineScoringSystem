<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.65" />

  <!-- Radiant Light Behind Cross -->
  <circle cx="256" cy="240" r="180" fill="url(#haloGlow)" />

  <!-- Outer Liturgical Ring -->
  <circle cx="256" cy="240" r="148" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 6" opacity="0.45" />
  <circle cx="256" cy="240" r="136" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3" />

  <!-- Church Crown of St. Saweros at Top of Cross -->
  <g transform="translate(256, 125)" filter="url(#dropShadow)">
    <path d="M-36 10 L-22 -14 L0 -4 L22 -14 L36 10 Z" fill="url(#goldGrad)" />
    <circle cx="-22" cy="-17" r="4.5" fill="#fef08a" />
    <circle cx="0" cy="-7" r="5.5" fill="#ffffff" />
    <circle cx="22" cy="-17" r="4.5" fill="#fef08a" />
    <rect x="-38" y="10" width="76" height="8" rx="3" fill="url(#goldGrad)" />
    <!-- Ruby Gemstones in Crown -->
    <circle cx="-18" cy="14" r="2.5" fill="#dc2626" />
    <circle cx="0" cy="14" r="3" fill="#2563eb" />
    <circle cx="18" cy="14" r="2.5" fill="#dc2626" />
  </g>

  <!-- Central Coptic Cross -->
  <g filter="url(#dropShadow)">
    <!-- Vertical Cross Beam -->
    <rect x="238" y="148" width="36" height="194" rx="10" fill="url(#crossGrad)" />
    <path d="M238 152 L256 136 L274 152 Z" fill="#ffffff" />
    <path d="M238 338 L256 352 L274 338 Z" fill="url(#goldGrad)" />

    <!-- Horizontal Cross Beam -->
    <rect x="160" y="212" width="192" height="36" rx="10" fill="url(#crossGrad)" />
    <path d="M164 212 L148 230 L164 248 Z" fill="#ffffff" />
    <path d="M348 212 L364 230 L348 248 Z" fill="url(#goldGrad)" />

    <!-- Cross Center Ring Accent -->
    <circle cx="256" cy="230" r="32" fill="none" stroke="url(#goldGrad)" stroke-width="7" />
    <circle cx="256" cy="230" r="14" fill="url(#goldGrad)" />
    <circle cx="256" cy="230" r="6" fill="#ffffff" />

    <!-- Four Corner Rays/Stars of the Coptic Cross -->
    <g stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round">
      <line x1="202" y1="176" x2="218" y2="192" />
      <circle cx="196" cy="170" r="4" fill="url(#goldGrad)" />

      <line x1="310" y1="176" x2="294" y2="192" />
      <circle cx="316" cy="170" r="4" fill="url(#goldGrad)" />

      <line x1="202" y1="284" x2="218" y2="268" />
      <circle cx="196" cy="290" r="4" fill="url(#goldGrad)" />

      <line x1="310" y1="284" x2="294" y2="268" />
      <circle cx="316" cy="290" r="4" fill="url(#goldGrad)" />
    </g>
  </g>

  <!-- Open Gospel / Bible at Base -->
  <g transform="translate(256, 380)" filter="url(#dropShadow)">
    <!-- Book Pages -->
    <path d="M-84 0 C-46 -12 -12 4 0 16 C12 4 46 -12 84 0 L80 40 C44 26 12 42 0 32 C-12 42 -44 26 -80 40 Z" fill="#ffffff" />
    <!-- Book Cover Edge -->
    <path d="M-86 38 C-48 24 -14 42 0 32 C14 42 48 24 86 38 L84 46 C46 32 14 50 0 39 C-14 50 -46 32 -84 46 Z" fill="url(#goldGrad)" />
    <!-- Bookmark Ribbon -->
    <path d="M-3 20 L-3 54 L6 47 L15 54 L15 20 Z" fill="#dc2626" />
    <!-- Text Lines Simulation on Bible -->
    <line x1="-66" y1="12" x2="-18" y2="18" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-66" y1="22" x2="-22" y2="27" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="18" y1="18" x2="66" y2="12" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="22" y1="27" x2="66" y2="22" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Bottom Brand Ribbon Banner -->
  <g transform="translate(256, 460)">
    <text text-anchor="middle" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#f8fafc" letter-spacing="2">POPE SAWEROS</text>
    <text text-anchor="middle" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f59e0b" letter-spacing="3">GRADE 4 SUNDAY SCHOOL</text>
  </g>
</svg>
